# Pre-commit hooks — runs automatically on `git commit`
# Formats code like PyCharm's Ctrl+Alt+L would

repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # Ruff: fast Python linter + auto-fixer (sorts imports, removes unused, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # Black: opinionated code formatter (like PyCharm's Ctrl+Alt+L)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
